<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"><defs><marker id="m1B2430" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#1B2430"/></marker><marker id="mB8741A" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#B8741A"/></marker><marker id="m1D6F8F" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D6F8F"/></marker><marker id="m8A96A3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A96A3"/></marker><marker id="m5A6675" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#5A6675"/></marker></defs><rect width="760" height="400" fill="#FFFFFF"/><rect x="20" y="60" width="190" height="150" rx="8" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.2"/><text x="115" y="82" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="13" fill="#1B2430" text-anchor="middle" font-weight="bold">scope</text><rect x="30" y="95" width="80" height="100" rx="4" fill="#F7EBD8" stroke="#B8741A" stroke-width="1.2"/><text x="70" y="112" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#B8741A" text-anchor="middle" font-weight="bold">owner</text><text x="70" y="130" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="middle" font-weight="normal">scope</text><text x="70" y="144" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="middle" font-weight="normal">priority</text><rect x="120" y="95" width="80" height="100" rx="4" fill="#DCEEF5" stroke="#1D6F8F" stroke-width="1.2"/><text x="160" y="112" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1D6F8F" text-anchor="middle" font-weight="bold">engineer</text><text x="160" y="130" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="middle" font-weight="normal">estimate</text><text x="160" y="144" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="middle" font-weight="normal">risks</text><rect x="260" y="60" width="190" height="150" rx="8" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.2"/><text x="355" y="82" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="13" fill="#1B2430" text-anchor="middle" font-weight="bold">ready</text><rect x="270" y="95" width="80" height="100" rx="4" fill="#F7EBD8" stroke="#B8741A" stroke-width="1.2"/><text x="310" y="112" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#B8741A" text-anchor="middle" font-weight="bold">owner</text><text x="310" y="130" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="middle" font-weight="normal">verdict</text><rect x="360" y="95" width="80" height="100" rx="4" fill="#DCEEF5" stroke="#1D6F8F" stroke-width="1.2"/><text x="400" y="112" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1D6F8F" text-anchor="middle" font-weight="bold">engineer</text><text x="400" y="130" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="middle" font-weight="normal">tests-green</text><text x="400" y="144" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="middle" font-weight="normal">evidence</text><text x="355" y="205" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9" fill="#5A6675" text-anchor="middle" font-weight="normal">engineer-first: owner blocked until evidence</text><rect x="500" y="60" width="190" height="150" rx="8" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.2"/><text x="595" y="82" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="13" fill="#1B2430" text-anchor="middle" font-weight="bold">shipped</text><rect x="510" y="95" width="80" height="100" rx="4" fill="#F7EBD8" stroke="#B8741A" stroke-width="1.2"/><text x="550" y="112" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#B8741A" text-anchor="middle" font-weight="bold">owner</text><text x="550" y="130" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="middle" font-weight="normal">acceptance</text><rect x="600" y="95" width="80" height="100" rx="4" fill="#DCEEF5" stroke="#1D6F8F" stroke-width="1.2"/><text x="640" y="112" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1D6F8F" text-anchor="middle" font-weight="bold">engineer</text><text x="640" y="130" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="middle" font-weight="normal">read-back</text><text x="640" y="144" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="middle" font-weight="normal">receipt</text><text x="595" y="205" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9" fill="#5A6675" text-anchor="middle" font-weight="normal">engineer-first</text><line x1="210" y1="135" x2="258" y2="135" stroke="#1B2430" stroke-width="1.4" marker-end="url(#m1B2430)"/><line x1="450" y1="135" x2="498" y2="135" stroke="#1B2430" stroke-width="1.4" marker-end="url(#m1B2430)"/><line x1="690" y1="135" x2="735" y2="135" stroke="#1B2430" stroke-width="1.4" marker-end="url(#m1B2430)"/><text x="234" y="120" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9" fill="#5A6675" text-anchor="middle" font-weight="normal">both</text><text x="234" y="130" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9" fill="#5A6675" text-anchor="middle" font-weight="normal">filled</text><text x="474" y="120" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9" fill="#5A6675" text-anchor="middle" font-weight="normal">both</text><text x="474" y="130" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9" fill="#5A6675" text-anchor="middle" font-weight="normal">filled</text><text x="715" y="120" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9" fill="#5A6675" text-anchor="middle" font-weight="normal">closed</text><rect x="20" y="250" width="720" height="120" rx="8" fill="#FBFCFD" stroke="#B9C2CC" stroke-width="1.2"/><text x="30" y="272" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1B2430" text-anchor="start" font-weight="bold">Handshake rules (board.deliver)</text><text x="30" y="292" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="start" font-weight="normal">1. A hat may file only items the gate lists for it; anything else is refused.</text><text x="30" y="307" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="start" font-weight="normal">2. With order: engineer-first the owner column is locked until the engineer column is complete. A verdict on no evidence is refused.</text><text x="30" y="322" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="start" font-weight="normal">3. Every delivery carries note, evidence and a timestamp; a read-back is a version string you observed, never a status word.</text><text x="30" y="337" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="start" font-weight="normal">4. When both columns are complete the thread advances to the next gate, or to closed after the last one. Nothing else moves it.</text><text x="30" y="352" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="start" font-weight="normal">5. Sync = the list of open gates with an empty column, naming the hat that owes. Timeline drift becomes a query, not a feeling.</text></svg>