<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"><defs><marker id="m1B2430" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#1B2430"/></marker><marker id="mB8741A" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#B8741A"/></marker><marker id="m1D6F8F" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D6F8F"/></marker><marker id="m8A96A3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#8A96A3"/></marker><marker id="m5A6675" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#5A6675"/></marker></defs><rect width="760" height="400" fill="#FFFFFF"/><rect x="20" y="20" width="460" height="300" rx="8" fill="#FBFCFD" stroke="#B9C2CC" stroke-width="1.2"/><text x="30" y="38" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#1B2430" text-anchor="start" font-weight="bold">tmux session: &lt;office name&gt;</text><rect x="35" y="55" width="130" height="80" rx="6" fill="#DCEEF5" stroke="#1D6F8F" stroke-width="1.2"/><text x="100.0" y="77" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1B2430" text-anchor="middle" font-weight="bold">window: pm</text><text x="100.0" y="93" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">claude --name pm</text><text x="100.0" y="106" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">--append-system-prompt-file</text><text x="100.0" y="119" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">roles/pm.md</text><rect x="180" y="55" width="130" height="80" rx="6" fill="#DCEEF5" stroke="#1D6F8F" stroke-width="1.2"/><text x="245.0" y="77" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1B2430" text-anchor="middle" font-weight="bold">window: dev</text><text x="245.0" y="93" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">claude --name dev</text><text x="245.0" y="106" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">--append-system-prompt-file</text><text x="245.0" y="119" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">roles/dev.md</text><rect x="325" y="55" width="140" height="80" rx="6" fill="#DCEEF5" stroke="#1D6F8F" stroke-width="1.2"/><text x="395.0" y="77" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1B2430" text-anchor="middle" font-weight="bold">window: review</text><text x="395.0" y="93" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">codex '&lt;role text&gt;'</text><text x="395.0" y="106" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">(no system-prompt flag,</text><text x="395.0" y="119" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">role is the first prompt)</text><rect x="35" y="160" width="430" height="50" rx="6" fill="#F7EBD8" stroke="#B8741A" stroke-width="1.2"/><text x="250.0" y="182" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1B2430" text-anchor="middle" font-weight="bold">window: you</text><text x="250.0" y="198" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">a plain shell: desk inbox --as owner · desk deliver · desk status</text><rect x="35" y="235" width="430" height="70" rx="6" fill="#EEF1F4" stroke="#5A6675" stroke-width="1.2"/><text x="250.0" y="257" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1B2430" text-anchor="middle" font-weight="bold">Repo working tree</text><text x="250.0" y="273" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">office.yaml · .office/board.yaml · .office/roles · .office/launches.yaml</text><text x="250.0" y="286" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">every desk reads these first; only desk deliver writes the board</text><line x1="100" y1="135" x2="100" y2="233" stroke="#5A6675" stroke-width="1.4" marker-end="url(#m5A6675)"/><line x1="245" y1="135" x2="245" y2="233" stroke="#5A6675" stroke-width="1.4" marker-end="url(#m5A6675)"/><line x1="395" y1="135" x2="395" y2="233" stroke="#5A6675" stroke-width="1.4" marker-end="url(#m5A6675)"/><line x1="250" y1="210" x2="250" y2="233" stroke="#B8741A" stroke-width="1.4" marker-end="url(#mB8741A)"/><rect x="520" y="55" width="220" height="80" rx="6" fill="#EEF1F4" stroke="#5A6675" stroke-width="1.2"/><text x="630.0" y="77" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1B2430" text-anchor="middle" font-weight="bold">Harness transcript logs</text><text x="630.0" y="93" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">written by each harness</text><text x="630.0" y="106" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">read by desk meter</text><rect x="520" y="160" width="220" height="60" rx="6" fill="#EEF1F4" stroke="#5A6675" stroke-width="1.2"/><text x="630.0" y="182" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1B2430" text-anchor="middle" font-weight="bold">git</text><text x="630.0" y="198" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">board + manifest are diffable</text><text x="630.0" y="211" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">progress derived, never typed</text><rect x="520" y="245" width="220" height="60" rx="6" fill="#EEF1F4" stroke="#8A96A3" stroke-width="1.2" stroke-dasharray="5,4"/><text x="630.0" y="267" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1B2430" text-anchor="middle" font-weight="bold">Later: mailbox + receipts</text><text x="630.0" y="283" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">per-desk inbox via hooks / codex queue</text><text x="630.0" y="296" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">signed record at the shipped gate</text><line x1="465" y1="95" x2="518" y2="95" stroke="#5A6675" stroke-width="1.4" marker-end="url(#m5A6675)"/><line x1="465" y1="270" x2="518" y2="190" stroke="#5A6675" stroke-width="1.4" marker-end="url(#m5A6675)"/><line x1="465" y1="290" x2="518" y2="275" stroke="#8A96A3" stroke-width="1.4" marker-end="url(#m8A96A3)" stroke-dasharray="5,4"/><text x="380" y="345" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">No daemon and no service: the office is a tmux session plus files. Close tmux and nothing is lost; the board is on disk.</text><text x="380" y="362" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">Codex desks are read-only participants until the mailbox exists (Codex project hooks do not run; its queue command is the likely bus).</text></svg>