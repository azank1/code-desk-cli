ght="80" rx="6" fill="#F7EBD8" stroke="#B8741A" stroke-width="1.2"/><text x="365.0" y="252" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1B2430" text-anchor="middle" font-weight="bold">Sprint window</text><text x="365.0" y="268" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">cadence.start + N×days</text><text x="365.0" y="281" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">or last 7 days</text><rect x="490" y="230" width="250" height="80" rx="6" fill="#F7EBD8" stroke="#B8741A" stroke-width="1.2"/><text x="615.0" y="252" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1B2430" text-anchor="middle" font-weight="bold">DeskUsage per sprint</text><text x="615.0" y="268" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">sessions · turns · in (cached) · out</text><text x="615.0" y="281" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">total vs budget → %</text><text x="615.0" y="294" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">projection = total / elapsed × 30 d</text><line x1="240" y1="65" x2="288" y2="110" stroke="#5A6675" stroke-width="1.4" marker-end="url(#m5A6675)"/><line x1="240" y1="175" x2="288" y2="140" stroke="#5A6675" stroke-width="1.4" marker-end="url(#m5A6675)"/><line x1="240" y1="275" x2="288" y2="150" stroke="#8A96A3" stroke-width="1.4" marker-end="url(#m8A96A3)" stroke-dasharray="5,4"/><line x1="440" y1="110" x2="488" y2="100" stroke="#1B2430" stroke-width="1.4" marker-end="url(#m1B2430)"/><text x="462" y="95" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">desk?</text><line x1="615" y1="170" x2="615" y2="228" stroke="#1B2430" stroke-width="1.4" marker-end="url(#m1B2430)"/><line x1="440" y1="270" x2="488" y2="270" stroke="#1B2430" stroke-width="1.4" marker-end="url(#m1B2430)"/><text x="464" y="262" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#5A6675" text-anchor="middle" font-weight="normal">filters turns</text><rect x="20" y="340" width="720" height="70" rx="8" fill="#FBFCFD" stroke="#B9C2CC" stroke-width="1.2"/><text x="30" y="362" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="start" font-weight="normal">Measured on this machine, 2026-09-21: 83 sessions (36 Claude Code, 47 Codex) read in 5.9 s; 25 Claude sessions carried a name.</text><text x="30" y="377" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="start" font-weight="normal">Meter first, estimate second: an estimate command is deliberately absent until a week of measured history exists.</text><text x="30" y="392" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1B2430" text-anchor="start" font-weight="normal">Numbers are tokens, never money: subscriptions are what developers actually hold, and their quotas are per-window token budgets.</text></svg>