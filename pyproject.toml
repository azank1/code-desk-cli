[project]
name = "coding-desks"
version = "0.0.1"
description = "Run an office of coding-harness sessions from the CLI: two hats, gated handoffs, a usage meter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.scripts]
desk = "coding_desks.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_desks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
